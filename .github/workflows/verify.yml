name: Verify AlHazem Vite

on:
  push:
    branches: ["111111", "fix/alhazem-vite-integration-2026-11-07"]
  pull_request:
    branches: ["111111"]

concurrency:
  group: alhazem-vite-verify-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type check
        run: npm run lint
      - name: Build Vite application
        run: npm run build
