name: Validate platform

on:
  push:
    branches:
      - "fix/runtime-audit-2026-11-05"
  pull_request:
    branches:
      - "111111"

permissions:
  contents: read

concurrency:
  group: validate-platform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
