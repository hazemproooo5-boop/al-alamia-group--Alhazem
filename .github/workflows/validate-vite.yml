name: Validate platform

on:
  push:
    branches:
      - "fix/runtime-audit-2026-11-05"
  pull_request:
    branches:
      - "111111"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-platform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
